<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HTML in Canvas — CTA Zoom Blur Demo</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<canvas class="CTA__Canvas" content="drawable">
	<div class="Page" drawable>
		<div class="Page__Inner">
			<div class="CTA">
				<h1>
					よも茶を定期購入しませんか？
				</h1>
				<p>
					最近話題のよも茶。量販店では売り切れが続出しており、めったに手に入らない状況です。<br />
					そこで、よも茶を定期購入できるサービスをご用意しました。
				</p>
				<div class="CTA__Features">
					<div class="CTA__Image">
						<img src="./img.webp" alt="" />
					</div>
					<h2>
						定期購入のメリット
					</h2>
					<ul>
						<li>
							毎月お届けするので、売り切れの心配がありません。
						</li>
						<li>
							定期購入は、いつでも解約可能です。お客様のライフスタイルに合わせて、柔軟にご利用いただけます。
						</li>
						<li>
							年払いでお支払いいただくと、毎月払いよりも2か月分お得です。
						</li>
					</ul>
				</div>
				<a href="#" drawable>
					今すぐ定期購入する
				</a>
			</div>
		</div>
	</div>
</canvas>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js';
import { getOffsetInCanvas, syncElementGeometry } from '../html-in-canvas.js';

const canvas   = document.querySelector( '.CTA__Canvas' );
const pageEl   = document.querySelector( '.Page' );
const buttonEl = document.querySelector( '.CTA > a' );

const renderer = new THREE.WebGLRenderer( { canvas, antialias: true } );
renderer.setPixelRatio( window.devicePixelRatio );
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

const scene  = new THREE.Scene();
const camera = new THREE.OrthographicCamera( - 1, 1, 1, - 1, - 1, 1 );

const pageTexture = new THREE.HTMLTexture( pageEl );
pageTexture.colorSpace = THREE.SRGBColorSpace;
pageTexture.minFilter = THREE.LinearFilter;
pageTexture.magFilter = THREE.LinearFilter;
pageTexture.wrapS = THREE.ClampToEdgeWrapping;
pageTexture.wrapT = THREE.ClampToEdgeWrapping;

const material = new THREE.ShaderMaterial( {

	uniforms: {
		uMap: { value: pageTexture },
		uCenter: { value: new THREE.Vector2( 0.5, 0.5 ) },
		uIntensity: { value: 0 },
		uStrength: { value: 0.25 },
	},
	vertexShader: /* glsl */`
		varying vec2 vUv;

		void main() {

			vUv = uv;
			gl_Position = vec4( position.xy, 0.0, 1.0 );

		}
	`,
	fragmentShader: /* glsl */`
		uniform sampler2D uMap;
		uniform vec2 uCenter;
		uniform float uIntensity;
		uniform float uStrength;
		varying vec2 vUv;

		const int N = 32;

		// dithering 用の hash (banding を破壊)
		float hash( vec2 p ) {

			return fract( sin( dot( p, vec2( 127.1, 311.7 ) ) ) * 43758.5453 );

		}

		void main() {

			vec2 uv = vUv;
			vec4 sharp = texture2D( uMap, uv );

			// idle: シェーダのほぼ全コストをスキップ
			if ( uIntensity < 0.001 ) {

				gl_FragColor = sharp;
				return;

			}

			// Evan Wallace 風 zoom blur:
			//   t = (i + offset) / N  ∈ (0, 1]
			//   weight = 4t(1-t)   (中央重み、両端で 0)
			//   sample = uv + toCenter * t * strength
			// ボタンは入れ子の drawable なので uMap に含まれず、ぼかしに巻き込まれない
			vec2 toCenter = uCenter - uv;
			float strength = uStrength * uIntensity;
			float offset = hash( uv );

			vec4 color = vec4( 0.0 );
			float total = 0.0;
			for ( int i = 0; i < N; i ++ ) {

				float t = ( float( i ) + offset ) / float( N );
				vec2 p = uv + toCenter * t * strength;

				float w = 4.0 * t * ( 1.0 - t );
				color += texture2D( uMap, p ) * w;
				total += w;

			}

			gl_FragColor = color / total;

		}
	`,
} );

const plane = new THREE.Mesh( new THREE.PlaneGeometry( 2, 2 ), material );
scene.add( plane );

// --- ボタン ---
// ボタンには drawable を付けて入れ子にしてあるので、pageTexture (.Page) にはボタンが含まれない。
// ページだけをぼかし、その上にボタンをくっきり重ねる。
// Three.js の HTMLTexture は、canvas の直接の子要素でない要素を canvas 直下へ移動してしまうので、
// ボタンのテクスチャは WebGL の API で直接書き込み、ExternalTexture として Three.js に渡す。
const gl = renderer.getContext();
const buttonGlTexture = gl.createTexture();
const buttonTexture = new THREE.ExternalTexture( buttonGlTexture );

const buttonPlane = new THREE.Mesh(
	new THREE.PlaneGeometry( 1, 1 ),
	new THREE.MeshBasicMaterial( { map: buttonTexture, transparent: true } ),
);
scene.add( buttonPlane );

let needButtonUpdate = true;

function updateButton() {

	const size = canvas.getElementImageDefaultSize( buttonEl );
	const width  = Math.ceil( size.width );
	const height = Math.ceil( size.height );
	if ( width === 0 || height === 0 ) return false;

	// Three.js の WebGLState がバインドと pixelStorei をキャッシュしているので、state 経由で設定する
	renderer.state.bindTexture( gl.TEXTURE_2D, buttonGlTexture );
	renderer.state.pixelStorei( gl.UNPACK_FLIP_Y_WEBGL, true );
	renderer.state.pixelStorei( gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, false );
	gl.texImage2D( gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null );
	gl.texElementSubImage2D( gl.TEXTURE_2D, 0, 0, 0, buttonEl );
	gl.texParameteri( gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR );
	gl.texParameteri( gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR );
	gl.texParameteri( gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE );
	gl.texParameteri( gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE );

	// ボタンのレイアウト上の位置に板を置く (canvas の CSS px → NDC)
	const { x, y } = getOffsetInCanvas( canvas, buttonEl );
	const w = buttonEl.offsetWidth;
	const h = buttonEl.offsetHeight;
	const canvasW = canvas.clientWidth;
	const canvasH = canvas.clientHeight;
	buttonPlane.scale.set( w / canvasW * 2, h / canvasH * 2, 1 );
	buttonPlane.position.set( ( x + w / 2 ) / canvasW * 2 - 1, 1 - ( y + h / 2 ) / canvasH * 2, 0 );

	// 入れ子の drawable も、位置を登録しないとヒットテスト (hover) の対象にならない
	syncElementGeometry( canvas, buttonEl );

	return true;

}

// canvas を viewport サイズに同期 (100vw x 100vh)
let canvasCssW = 0;
let canvasCssH = 0;

function syncCanvasSize() {

	const w = window.innerWidth;
	const h = window.innerHeight;
	if ( w === canvasCssW && h === canvasCssH ) return false;

	canvasCssW = w;
	canvasCssH = h;
	renderer.setSize( w, h, false );
	needButtonUpdate = true;

	// ページは canvas いっぱいに等倍で描くので、レイアウトどおりの位置をヒットテスト用に登録する
	syncElementGeometry( canvas, pageEl );

	return true;

}

syncCanvasSize();
window.addEventListener( 'resize', syncCanvasSize );

// hover 状態
let targetIntensity = 0;
let intensity = 0;
let lastTime = 0;

function setCenterFromClient( clientX, clientY ) {

	const r = canvas.getBoundingClientRect();
	if ( r.width === 0 || r.height === 0 ) return;
	const uvX = ( clientX - r.left ) / r.width;
	const uvY = 1.0 - ( clientY - r.top ) / r.height;
	material.uniforms.uCenter.value.set( uvX, uvY );

}

// マウス hover: enter/leave で blur on/off。center は move で追従。
buttonEl.addEventListener( 'pointerenter', ( e ) => {

	if ( e.pointerType === 'touch' ) return;
	targetIntensity = 1;

} );

buttonEl.addEventListener( 'pointerleave', ( e ) => {

	if ( e.pointerType === 'touch' ) return;
	targetIntensity = 0;

} );

window.addEventListener( 'pointermove', ( e ) => {

	if ( e.pointerType === 'touch' ) return;
	setCenterFromClient( e.clientX, e.clientY );

} );

// タッチ: touchstart で blur on, touchend / touchcancel で off。touchmove で center 追従。
buttonEl.addEventListener( 'touchstart', ( e ) => {

	if ( e.touches.length === 0 ) return;
	const t = e.touches[ 0 ];
	setCenterFromClient( t.clientX, t.clientY );
	targetIntensity = 1;

}, { passive: true } );

window.addEventListener( 'touchmove', ( e ) => {

	if ( e.touches.length === 0 ) return;
	const t = e.touches[ 0 ];
	setCenterFromClient( t.clientX, t.clientY );

}, { passive: true } );

window.addEventListener( 'touchend', () => { targetIntensity = 0; }, { passive: true } );
window.addEventListener( 'touchcancel', () => { targetIntensity = 0; }, { passive: true } );

// 初回 paint ガード
let painted = false;
const _htmlTexturePaint = canvas.onpaint;
canvas.onpaint = ( e ) => {

	if ( _htmlTexturePaint ) _htmlTexturePaint.call( canvas, e );
	syncCanvasSize();
	needButtonUpdate = true;
	painted = true;

};

renderer.setAnimationLoop( ( now ) => {

	if ( ! painted ) return;

	const dt = lastTime ? Math.min( 0.05, ( now - lastTime ) / 1000 ) : 0;
	lastTime = now;

	// ease toward target intensity (tau = 80ms で ~200ms フェード)
	const k = 1.0 - Math.exp( - dt / 0.08 );
	intensity += ( targetIntensity - intensity ) * k;
	material.uniforms.uIntensity.value = intensity;

	if ( needButtonUpdate && updateButton() ) needButtonUpdate = false;
	renderer.render( scene, camera );

} );
</script>
</body>
</html>
